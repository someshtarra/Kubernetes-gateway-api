# ==============================================================================
# Production Helm Values for Istiod (Istio Control Plane)
# Chart: istio/istiod (Recommended: v1.23+ / v1.24+)
# Documentation: https://istio.io/latest/docs/tasks/traffic-management/ingress/gateway-api/
# ==============================================================================

global:
  # Tagged release version
  tag: 1.24.0
  hub: docker.io/istio

# High Availability configuration for istiod
pilot:
  autoscaleEnabled: true
  autoscaleMin: 2
  autoscaleMax: 5
  cpu:
    targetAverageUtilization: 75

  # Resource requests and limits to guarantee scheduling and prevent node starvation
  resources:
    requests:
      cpu: 500m
      memory: 1024Mi
    limits:
      cpu: 2000m
      memory: 2048Mi

  # Enable Kubernetes Gateway API controller support in istiod
  env:
    PILOT_ENABLE_GATEWAY_API: "true"
    PILOT_ENABLE_GATEWAY_API_STATUS: "true"
    PILOT_ENABLE_GATEWAY_API_DEPLOYMENT_CONTROLLER: "true"

  # Spread istiod pods across availability zones and nodes
  affinity:
    podAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            labelSelector:
              matchLabels:
                app: istiod
            topologyKey: kubernetes.io/hostname

  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: topology.kubernetes.io/zone
      whenUnsatisfiable: ScheduleAnyway
      labelSelector:
        matchLabels:
          app: istiod

# Hardened security context adhering to Restricted Pod Security Standards
securityContext:
  runAsNonRoot: true
  runAsUser: 1337
  runAsGroup: 1337
  fsGroup: 1337

# Prometheus telemetry export
meshConfig:
  enablePrometheusMerge: true
  accessLogFile: /dev/stdout
  accessLogEncoding: JSON
  defaultConfig:
    holdApplicationUntilProxyStarts: true
