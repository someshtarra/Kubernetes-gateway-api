---
# ==============================================================================
# Multi-Tenant Namespaces with Istio Auto-Injection and Restricted Pod Security
# ==============================================================================
apiVersion: v1
kind: Namespace
metadata:
  name: gateway-infra
  labels:
    app.kubernetes.io/part-of: ingress-platform
    istio-injection: enabled
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: v1
kind: Namespace
metadata:
  name: production-apps
  labels:
    # Route delegation selector label
    istio.io/route-allowed: "true"
    tenant: core-services
    istio-injection: enabled
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
