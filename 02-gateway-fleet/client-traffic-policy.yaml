---
# ==============================================================================
# Production ClientTrafficPolicy
# Hardens client-to-gateway transport parameters (TLS cipher suite, client IP preservation)
# ==============================================================================
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: ClientTrafficPolicy
metadata:
  name: client-traffic-hardening
  namespace: gateway-infra
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: production-gateway
  # Enforce modern TLS protocols and secure cipher suites
  tls:
    minVersion: "1.2"
    maxVersion: "1.3"
    ciphers:
      - "ECDHE-ECDSA-AES128-GCM-SHA256"
      - "ECDHE-RSA-AES128-GCM-SHA256"
      - "ECDHE-ECDSA-AES256-GCM-SHA384"
      - "ECDHE-RSA-AES256-GCM-SHA384"
      - "ECDHE-ECDSA-CHACHA20-POLY1305"
      - "ECDHE-RSA-CHACHA20-POLY1305"
  # Preserve real client IP from external L4 / L7 cloud load balancers
  clientIPDetection:
    xForwardedFor:
      numTrustedHops: 1
  # HTTP/2 connection tuning
  http2:
    initialStreamWindowSize: 65536
    initialConnectionWindowSize: 1048576
  # Idle connection timeout
  timeout:
    http:
      idleTimeout: 60s
