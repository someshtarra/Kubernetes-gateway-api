---
# ==============================================================================
# Production Gateway: Managed by Platform / Network Operations Team
# Controller: istio.io/gateway-controller
# When applied, istiod automatically provisions an HA proxy deployment & service
# in the gateway-infra namespace.
# ==============================================================================
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: production-gateway
  namespace: gateway-infra
  annotations:
    # Controls the auto-provisioned Service and Deployment by Istio
    networking.istio.io/service-type: LoadBalancer
    proxy.istio.io/config: |
      concurrency: 2
spec:
  gatewayClassName: istio
  listeners:
    # Listener 1: Port 80 (HTTP) - dedicated to redirecting all traffic to HTTPS
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: Same

    # Listener 2: Port 443 (HTTPS) - primary entry point with TLS termination
    - name: https
      protocol: HTTPS
      port: 443
      hostname: "*.example.com"
      tls:
        mode: Terminate
        certificateRefs:
          - group: ""
            kind: Secret
            name: wildcard-example-tls
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              istio.io/route-allowed: "true"

---
# ==============================================================================
# HTTP-to-HTTPS Automatic Redirection Route
# Standard Gateway API portable redirect rule
# ==============================================================================
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: http-to-https-redirect
  namespace: gateway-infra
spec:
  parentRefs:
    - name: production-gateway
      namespace: gateway-infra
      sectionName: http
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
