---
# ==============================================================================
# Production BackendTrafficPolicy
# Provides upstream resilience: active health checking, automatic retries,
# circuit breaking, and connection timeouts.
# ==============================================================================
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: backend-resilience-policy
  namespace: production-apps
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: basic-routing
  # Active Outlier Detection / Health Checking
  healthCheck:
    active:
      type: HTTP
      http:
        path: /
      interval: 5s
      timeout: 2s
      unhealthyThreshold: 3
      healthyThreshold: 2
      expectedStatuses:
        - 200
  # Intelligent Retries with Exponential Backoff
  retry:
    numRetries: 3
    retryOn:
      triggers:
        - "5xx"
        - "gateway-error"
        - "reset"
        - "connect-failure"
    perRetry:
      timeout: 2s
      backOff:
        baseInterval: 25ms
        maxInterval: 250ms
  # Circuit Breaker to prevent cascading failures
  circuitBreaker:
    maxConnections: 1024
    maxPendingRequests: 100
    maxRequests: 1024
    maxRetries: 3
  # End-to-end request and idle timeouts
  timeout:
    http:
      requestTimeout: 10s
      connectionIdleTimeout: 60s
