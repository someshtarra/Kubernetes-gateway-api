---
# ==============================================================================
# Production RateLimitPolicy
# Protects APIs and backends against noisy neighbors, scrapers, and volumetric abuse.
# ==============================================================================
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: RateLimitPolicy
metadata:
  name: client-rate-limit-policy
  namespace: production-apps
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: basic-routing
  # Local rate limiting enforced directly within the Envoy Proxy data plane
  local:
    rules:
      - clientSelectors:
          - headers:
              - name: x-user-tier
                value: free
        limit:
          requests: 50
          unit: Minute
      - clientSelectors:
          - headers:
              - name: x-user-tier
                value: premium
        limit:
          requests: 1000
          unit: Minute
      - default:
          requests: 200
          unit: Minute
