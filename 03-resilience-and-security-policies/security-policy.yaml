---
# ==============================================================================
# Production SecurityPolicy
# Enforces CORS, security response headers, and JWT/OIDC authentication scaffolding
# ==============================================================================
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: api-security-policy
  namespace: production-apps
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: basic-routing
  # Cross-Origin Resource Sharing (CORS) hardening
  cors:
    allowOrigins:
      - "https://*.example.com"
      - "https://example.com"
    allowMethods:
      - GET
      - POST
      - PUT
      - DELETE
      - PATCH
      - OPTIONS
    allowHeaders:
      - keep-alive
      - user-agent
      - cache-control
      - content-type
      - authorization
      - x-requested-with
      - x-request-id
    exposeHeaders:
      - x-request-id
      - x-envoy-upstream-service-time
    maxAge: 24h
    allowCredentials: true
