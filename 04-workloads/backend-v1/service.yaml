---
# ==============================================================================
# Production Service for Backend v1
# ==============================================================================
apiVersion: v1
kind: Service
metadata:
  name: backend-v1
  namespace: production-apps
  labels:
    app.kubernetes.io/name: backend
    app.kubernetes.io/instance: backend-v1
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: backend
    app.kubernetes.io/instance: backend-v1
  ports:
    - name: http
      port: 3000
      targetPort: http
      protocol: TCP
      # Hints the Gateway controller to optimize HTTP/1.1 or HTTP/2 transport
      appProtocol: http
