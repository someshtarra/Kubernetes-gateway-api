---
# ==============================================================================
# NetworkPolicy for Backend v2 (Canary)
# Implements zero-trust isolation: only allows ingress traffic from Gateway pods
# ==============================================================================
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: backend-v2-allow-gateway
  namespace: production-apps
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: backend
      app.kubernetes.io/instance: backend-v2
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        # Allow ingress from Gateway data plane pods in gateway-infra namespace
        - namespaceSelector:
            matchLabels:
              app.kubernetes.io/part-of: ingress-platform
          podSelector:
            matchLabels:
              gateway.networking.k8s.io/gateway-name: production-gateway
      ports:
        - protocol: TCP
          port: 3000
  egress:
    # Allow DNS resolution to kube-system CoreDNS
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
