---
# ==============================================================================
# Production Service for Backend v2 (Canary)
# ==============================================================================
apiVersion: v1
kind: Service
metadata:
  name: backend-v2
  namespace: production-apps
  labels:
    app.kubernetes.io/name: backend
    app.kubernetes.io/instance: backend-v2
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: backend
    app.kubernetes.io/instance: backend-v2
  ports:
    - name: http
      port: 3000
      targetPort: http
      protocol: TCP
      appProtocol: http
