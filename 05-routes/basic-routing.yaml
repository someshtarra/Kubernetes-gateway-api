---
# ==============================================================================
# Production HTTPRoute: Basic Routing & Header Manipulation
# Attached to the production Gateway across namespace boundaries.
# ==============================================================================
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: basic-routing
  namespace: production-apps
  labels:
    app.kubernetes.io/name: backend-route
    app.kubernetes.io/component: ingress-routing
spec:
  parentRefs:
    - name: production-gateway
      namespace: gateway-infra
      sectionName: https
  hostnames:
    - "app.example.com"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      # Production filters: Inject security & tracing headers
      filters:
        - type: RequestHeaderModifier
          requestHeaderModifier:
            set:
              - name: X-Forwarded-Proto
                value: https
        - type: ResponseHeaderModifier
          responseHeaderModifier:
            set:
              - name: X-Content-Type-Options
                value: nosniff
              - name: X-Frame-Options
                value: DENY
              - name: Strict-Transport-Security
                value: "max-age=31536000; includeSubDomains"
      backendRefs:
        - group: ""
          kind: Service
          name: backend-v1
          port: 3000
          weight: 1
