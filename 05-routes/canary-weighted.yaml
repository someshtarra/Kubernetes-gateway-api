---
# ==============================================================================
# Production HTTPRoute: Canary Weighted Traffic Splitting (90/10)
# Safely rolls out new backend versions with controlled blast radius
# ==============================================================================
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: canary-weighted-routing
  namespace: production-apps
spec:
  parentRefs:
    - name: production-gateway
      namespace: gateway-infra
      sectionName: https
  hostnames:
    - "canary.example.com"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        # Stable baseline receives 90% of incoming production traffic
        - group: ""
          kind: Service
          name: backend-v1
          port: 3000
          weight: 90
        # Canary deployment receives 10% of incoming production traffic
        - group: ""
          kind: Service
          name: backend-v2
          port: 3000
          weight: 10
