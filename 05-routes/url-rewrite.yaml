---
# ==============================================================================
# Production HTTPRoute: URL Prefix & Full Path Rewriting
# Rewrites external public APIs to internal microservice endpoint formats
# ==============================================================================
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: url-rewrite-routing
  namespace: production-apps
spec:
  parentRefs:
    - name: production-gateway
      namespace: gateway-infra
      sectionName: https
  hostnames:
    - "api.example.com"
  rules:
    # Rule 1: Prefix Rewrite: maps /api/v1/echo/... -> /...
    - matches:
        - path:
            type: PathPrefix
            value: /api/v1/echo
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /
      backendRefs:
        - group: ""
          kind: Service
          name: backend-v1
          port: 3000
    # Rule 2: Full Path Rewrite: maps /ping -> / (exact match)
    - matches:
        - path:
            type: Exact
            value: /ping
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplaceFullPath
              replaceFullPath: /
      backendRefs:
        - group: ""
          kind: Service
          name: backend-v1
          port: 3000
